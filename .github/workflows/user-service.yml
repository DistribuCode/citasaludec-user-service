name: Build and Deploy User Service

on:
  push:
    branches:
      - qa

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:latest .

      - name: 📤 Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/user-service:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔑 Write EC2 SSH key
        run: |
          echo "${{ secrets.EC2_KEY }}" > auth-key.pem
          chmod 600 auth-key.pem

      - name: 🚀 Deploy to EC2 via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -i auth-key.pem ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            docker network create my_network || true

            # MongoDB para user-service
            docker stop user-db || true
            docker rm user-db || true
            docker run -d \
              --name user-db \
              --network my_network \
              -v user_data:/data/db \
              mongo:6.0

            sleep 10

            # user-service
            docker stop user-service || true
            docker rm user-service || true
            docker pull jeffri1997/user-service:latest
            docker run -d \
              --name user-service \
              --network my_network \
              -p 4000:4000 \
              -e PORT=4000 \
              -e MONGO_URI=mongodb://user-db:27017/users \
              -e JWT_SECRET=supersecretkey \
              jeffri1997/user-service:latest
          EOF
